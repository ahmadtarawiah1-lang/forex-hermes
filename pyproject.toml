[project]
name = "forex-hermes"
version = "0.1.0"
description = "Self-improving paper-trading bot for EUR/USD"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=23.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forex_hermes"]
